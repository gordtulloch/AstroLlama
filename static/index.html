<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalAI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="sidebar-brand">
          <div id="sidebar-pulse" class="pulse-idle" aria-hidden="true">
            <div class="pulse-core"></div>
            <div class="pulse-ring pulse-ring-a"></div>
            <div class="pulse-ring pulse-ring-b"></div>
            <div class="pulse-ring pulse-ring-c"></div>
          </div>
          <span id="brand-name">AstroLlama</span>
        </div>
      </div>

      <div id="status-bar">
        <span id="status-llama" class="status-chip">llama &#9679;</span>
        <span id="status-mcp" class="status-chip">mcp &#9679;</span>
      </div>

      <div id="auth-bar">
        <div id="auth-user">Not signed in</div>
        <div id="auth-actions">
          <button id="btn-login" title="Sign in with Microsoft Entra">Sign in</button>
          <button id="btn-logout" title="Sign out">Sign out</button>
        </div>
      </div>

      <div id="conv-list-header">Saved conversations</div>
      <ul id="conv-list"></ul>

      <div id="sidebar-footer">
        <button id="btn-new-chat" title="New conversation">&#43; New</button>
        <button id="btn-save-conv" title="Save current conversation">&#128190; Save</button>
        <img id="sidebar-logo-footer" src="astrollama.png" alt="AstroLlama Logo" />
      </div>
    </aside>
    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Main chat area -->
    <main id="main">
      <div id="mobile-topbar">
        <button id="btn-sidebar-toggle" class="btn-secondary" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
        <span class="mobile-title">AstroLlama</span>
      </div>
      <div id="messages"></div>

      <div id="input-area">
        <textarea
          id="prompt-input"
          placeholder="Message… (Enter to send, Shift+Enter for newline)"
          rows="3"
          autofocus
        ></textarea>
        <div id="input-controls">
          <button id="btn-send" class="btn-primary">Send</button>
          <button id="btn-mic" class="btn-secondary" title="Start voice input" aria-pressed="false">Mic</button>
          <button id="btn-more-actions" class="btn-secondary" type="button" aria-expanded="false" aria-controls="input-controls">More</button>
          <button id="btn-viz-fullscreen" class="btn-secondary secondary-action" title="Open full screen visualization" aria-pressed="false">Full Screen Visual</button>
          <button id="btn-tts" class="btn-secondary secondary-action" title="Toggle read-aloud" aria-pressed="false">Voice Off</button>
          <button id="btn-cancel" class="btn-danger secondary-action" disabled>Cancel</button>
          <button id="btn-tools" class="btn-secondary secondary-action" title="Configure tool valves">Tools &#9881;</button>
          <details id="settings-panel" class="secondary-action">
            <summary>&#9881; Settings</summary>
            <div class="settings-grid">
              <label>Temperature
                <input type="number" id="s-temperature" min="0" max="2" step="0.05" value="0.7" />
              </label>
              <label>Top-p
                <input type="number" id="s-top_p" min="0" max="1" step="0.05" value="0.9" />
              </label>
              <label>Max tokens
                <input type="number" id="s-max_tokens" min="1" max="32768" step="64" value="1024" />
              </label>
              <label class="full-width">System prompt
                <textarea id="s-system_prompt" rows="3" placeholder="(optional)"></textarea>
              </label>
              <label class="full-width">Voice
                <select id="s-voice"></select>
              </label>
              <label>Voice speed
                <input type="number" id="s-voice-rate" min="0.7" max="1.25" step="0.05" value="0.95" />
              </label>
              <label>Voice pitch
                <input type="number" id="s-voice-pitch" min="0.8" max="1.2" step="0.05" value="1.0" />
              </label>
              <label>
                Preview
                <button type="button" id="btn-voice-preview" class="btn-secondary">Test Voice</button>
              </label>
              <label class="full-width">
                <input type="checkbox" id="s-reactive-orb" checked />
                Mic-reactive orb while speaking
              </label>
              <label class="full-width">
                <input type="checkbox" id="s-viz-fullscreen-default" />
                Open visualization in full screen instead of chat window
              </label>
              <label class="full-width">
                <input type="checkbox" id="s-hide-tool-bubbles" />
                Hide tool bubbles in assistant messages
              </label>
              <label class="full-width">
                <input type="checkbox" id="s-disable-voice-processing" />
                Hide voice buttons and disable voice processing
              </label>
            </div>
          </details>
        </div>
      </div>
    </main>
  </div>

  <div id="voice-start-gate" aria-hidden="true" class="hidden">
    <div class="voice-start-card" role="dialog" aria-modal="true" aria-labelledby="voice-start-title">
      <div class="voice-start-title" id="voice-start-title">Voice Ready Check</div>
      <p class="voice-start-copy">Start voice once to unlock spoken responses and wake listening.</p>
      <button id="btn-voice-start" class="btn-primary" type="button">Start Voice</button>
    </div>
  </div>

  <div id="tools-modal" aria-hidden="true" class="tools-modal hidden">
    <div class="tools-modal-card" role="dialog" aria-modal="true" aria-labelledby="tools-modal-title">
      <div class="tools-modal-head">
        <div class="tools-modal-title" id="tools-modal-title">Tool Valves</div>
        <button id="btn-tools-close" class="btn-secondary" type="button" title="Close">Close</button>
      </div>
      <div class="tools-modal-body">
        <label class="tools-select-label">Tool
          <select id="tools-select"></select>
        </label>
        <div id="tools-valves-form" class="tools-valves-form"></div>
      </div>
      <div class="tools-modal-foot">
        <button id="btn-tools-refresh" class="btn-secondary" type="button">Refresh</button>
        <button id="btn-tools-save" class="btn-primary" type="button">Save Valves</button>
      </div>
    </div>
  </div>

  <div id="viz-fullscreen" aria-hidden="true">
    <div id="fullscreen-pulse" class="pulse-idle" aria-hidden="true">
      <div class="pulse-core"></div>
      <div class="pulse-ring pulse-ring-a"></div>
      <div class="pulse-ring pulse-ring-b"></div>
      <div class="pulse-ring pulse-ring-c"></div>
    </div>
    <div id="viz-fullscreen-hint">Press Esc to exit full screen</div>
  </div>

  <!-- MSAL is loaded dynamically by app.js with fallback CDN support -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script src="js/features/tools/valvesModal.js?v=20260509d"></script>
  <script src="app.js?v=20260517g"></script>
</body>
</html>
